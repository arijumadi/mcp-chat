name: ACP real agent probe

# Runs the ignored test that speaks to a real vendor ACP agent.
#
# Kept separate from `core.yml` because it downloads a ~100 MB vendor binary and
# needs a signed-in account for anything beyond the handshake. Run it by hand
# when changing the client, a preset, or the auth handling.

on:
  # Also runs on the pull request that changes this workflow, so the download
  # and probe are verified before it becomes manual-only.
  pull_request:
    paths:
      - ".github/workflows/acp-real.yml"
      - "crates/mcp-chat-core/tests/acp_real_agent.rs"
      - "crates/mcp-chat-core/src/acp/**"
  workflow_dispatch:
    inputs:
      agent:
        description: "Which vendor CLI to probe"
        required: true
        default: antigravity
        type: choice
        options:
          - antigravity

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  antigravity:
    name: Antigravity handshake
    # `inputs.agent` is empty outside workflow_dispatch, so treat that as the
    # default rather than skipping the job on a pull request.
    if: inputs.agent == '' || inputs.agent == 'antigravity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: acp-real

      # Google publishes a Linux x64 tarball per release. The archive contains
      # a single executable named `antigravity`.
      - name: Install Antigravity CLI
        env:
          # Pinned on purpose: the probe asserts behaviour, so a silent vendor
          # upgrade should be a deliberate change, not a surprise red build.
          AGY_VERSION: "1.5.18"
        run: |
          set -euo pipefail
          # The release URL is deterministic, so no API call (and no rate limit).
          url="https://github.com/google-antigravity/antigravity-cli/releases/download/${AGY_VERSION}/agy_cli_linux_x64.tar.gz"
          echo "Downloading $url"
          mkdir -p "$RUNNER_TEMP/agy"
          curl -fsSL "$url" -o "$RUNNER_TEMP/agy/agy.tar.gz"
          tar xzf "$RUNNER_TEMP/agy/agy.tar.gz" -C "$RUNNER_TEMP/agy"
          # The tarball contains `antigravity`; the installer exposes it as
          # `agy`. Name it the way the vendor does, so the probe uses the same
          # command a user would.
          mv "$RUNNER_TEMP/agy/antigravity" "$RUNNER_TEMP/agy/agy"
          chmod +x "$RUNNER_TEMP/agy/agy"
          "$RUNNER_TEMP/agy/agy" --version

      - name: Probe the agent
        env:
          AGY_BIN: ${{ runner.temp }}/agy/agy
        run: |
          # No signed-in account on a runner, so the prompt test skips itself and
          # the capability/auth assertions still run.
          cargo test -p mcp-chat-core --test acp_real_agent -- --ignored --nocapture
