name: ACP real agent probe

# Runs the ignored test that speaks to a real vendor ACP agent.
#
# Kept separate from `core.yml` because it downloads a ~100 MB vendor binary and
# needs a signed-in account for anything beyond the handshake. Run it by hand
# when changing the client, a preset, or the auth handling.

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Which vendor CLI to probe"
        required: true
        default: antigravity
        type: choice
        options:
          - antigravity

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  antigravity:
    name: Antigravity handshake
    if: inputs.agent == 'antigravity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: acp-real

      # Google publishes a Linux x64 tarball per release. The archive contains
      # a single executable named `antigravity`.
      - name: Install Antigravity CLI
        env:
          # Pinned on purpose: the probe asserts behaviour, so a silent vendor
          # upgrade should be a deliberate change, not a surprise red build.
          AGY_VERSION: "1.5.18"
        run: |
          set -euo pipefail
          # The release URL is deterministic, so no API call (and no rate limit).
          url="https://github.com/google-antigravity/antigravity-cli/releases/download/${AGY_VERSION}/agy_cli_linux_x64.tar.gz"
          echo "Downloading $url"
          mkdir -p "$RUNNER_TEMP/agy"
          curl -fsSL "$url" -o "$RUNNER_TEMP/agy/agy.tar.gz"
          tar xzf "$RUNNER_TEMP/agy/agy.tar.gz" -C "$RUNNER_TEMP/agy"
          chmod +x "$RUNNER_TEMP/agy/antigravity"
          "$RUNNER_TEMP/agy/antigravity" --version

      - name: Probe the agent
        env:
          AGY_BIN: ${{ runner.temp }}/agy/antigravity
        run: |
          cargo test -p mcp-chat-core --test acp_real_agent -- --ignored --nocapture
