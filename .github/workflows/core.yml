name: Core checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/mcp-chat-core/**"
      - "src-tauri/**"
      - "shared/**"
      - "tests/mock_servers/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/core.yml"
  push:
    branches:
      - master
    paths:
      - "crates/mcp-chat-core/**"
      - "src-tauri/**"
      - "shared/**"
      - "tests/mock_servers/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/core.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p mcp-chat-core --all-targets -- -D warnings

      - name: Test
        run: cargo test -p mcp-chat-core

      - name: Mock server tests
        run: cargo test -p mcp-mock

  app:
    # `build.yml` only runs on a tag, so without this job a broken Tauri command
    # would first surface during a release. Type-checking the app crate is
    # enough to catch it; a full bundle build stays on the release path.
    name: App crate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: app-crate

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      # The Tauri build script needs the frontend entry point to exist.
      - name: Create frontend placeholder
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Check the app crate
        run: cargo check -p mcp-chat --all-targets
