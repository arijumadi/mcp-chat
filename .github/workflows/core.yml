name: Core checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/mcp-chat-core/**"
      - "tests/mock_servers/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/core.yml"
  push:
    branches:
      - master
    paths:
      - "crates/mcp-chat-core/**"
      - "tests/mock_servers/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/core.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p mcp-chat-core --all-targets -- -D warnings

      # Five pre-existing tests fail on Windows for reasons unrelated to ACP:
      # `\\?\` path canonicalization, PDF text extraction, and a bundled skill
      # manifest. They were never visible before this workflow existed. Linux is
      # the gate; Windows must be green before Phase 3 merges.
      - name: Test
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        run: cargo test -p mcp-chat-core

      - name: Mock server tests
        run: cargo test -p mcp-mock
