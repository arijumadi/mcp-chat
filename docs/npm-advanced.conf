# Nginx snippet for Jarvis behind Nginx Proxy Manager.
#
# Paste this into the proxy host's "Advanced" tab, for ai.arjum.com.
#
# Measured before the fix: 13 SSE deltas arrived in 231ms over the LAN, and
# none at all arrived through NPM within 45 seconds -- the stream was buffered
# and only flushed when it ended, which is what "streaming macet, pindah chat
# balik lagi sudah selesai" describes.
#
# Two things are needed, and they work together:
#   1. Jarvis sends `X-Accel-Buffering: no` (done in events.rs)
#   2. The proxy must not buffer the response, which is what this does

# ---- SSE: /api/events ------------------------------------------------------
#
# proxy_buffering off is the important line. gzip must be off too: compressing
# an event stream makes the proxy hold bytes until it has a full block, which
# reintroduces exactly the lag we are removing.
location = /api/events {
    proxy_pass http://192.168.11.11:8787;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The stream is long-lived: do not let the proxy cut it, and do not buffer.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;

    # Keep the client connection open the same way.
    proxy_set_header Connection "";

    gzip off;
}

# ---- Everything else -------------------------------------------------------
location / {
    proxy_pass http://192.168.11.11:8787;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A turn can take minutes; the default 60s would cut the request that
    # starts it, leaving a chat that streams but cannot be prompted.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_buffering off;
    gzip off;
}
