[package]
name = "mcp-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A local-first desktop chat app for LLMs and remote MCP servers"
default-run = "mcp-chat"

[lib]
name = "mcp_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
mcp-chat-core = { path = "../crates/mcp-chat-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
